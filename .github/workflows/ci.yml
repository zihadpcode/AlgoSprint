name: Validate AlgoSprint

on:
  pull_request:
  push:
    branches: [main, "algosprint/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algosprint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d algosprint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/algosprint_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/algosprint_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local reconciliation rehearsal reads only these two immutable source
      # commits; checkout's depth-one tree does not otherwise contain them.
      - name: Fetch pinned reconciliation source objects
        run: git fetch --no-tags --depth=1 origin 1bacb2f947de89e92cb4fc08604132c1b78090e0 03c3ac9936a4b5ada88a53888d5bb09475f38cca
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run problems:check
      - run: npm run seed:validate
      - run: npm test
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:trace
      - run: npm run test:smoke
      - run: npm run db:seed
      - run: node scripts/smoke-library.mjs
